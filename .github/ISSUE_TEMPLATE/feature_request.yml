name: Feature request
description: Propose a new feature or enhancement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For larger or cross-cutting proposals, consider opening a
        discussion first so the design can be worked out before code is
        written.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's the current limitation or pain point?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: willing
    attributes:
      label: Are you willing to submit a PR for this?
      options:
        - "Yes"
        - "Yes, with guidance"
        - "No"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
